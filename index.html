<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled Space Flight</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='none' stroke='%23d4408f' stroke-width='1.5'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%23000'/%3E%3C/svg%3E">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
    #hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #667;
      font-family: monospace;
      font-size: 14px;
      letter-spacing: 0.2em;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.4s;
    }
    #hint.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="hint">CLICK TO FLY</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
