        <span style="width: 4px; height: 22px; background: #ffd23f; box-shadow: 0 0 10px #ffd23f; opacity: {{ a5 }};"></span>

      <button type="button" onClick="{{ p4 }}" style="display: grid; grid-template-columns: 4px 30px 1fr; align-items: center; gap: 11px; padding: 9px 13px; background: transparent; border: 0; border-bottom: 1px solid rgba(182,163,201,0.12); font: inherit; color: #f4e9ff; text-align: left; cursor: pointer;" style-hover="background: rgba(255,95,168,0.12);">
        <span style="width: 4px; height: 22px; background: #ff5fa8; box-shadow: 0 0 10px #ff5fa8; opacity: {{ a4 }};"></span>

      <button type="button" onClick="{{ p3 }}" style="display: grid; grid-template-columns: 4px 30px 1fr; align-items: center; gap: 11px; padding: 9px 13px; background: transparent; border: 0; border-bottom: 1px solid rgba(182,163,201,0.12); font: inherit; color: #f4e9ff; text-align: left; cursor: pointer;" style-hover="background: rgba(255,255,255,0.1);">
        <span style="width: 4px; height: 22px; background: #ffffff; box-shadow: 0 0 10px #ffffff; opacity: {{ a3 }};"></span>

      <button type="button" onClick="{{ p2 }}" style="display: grid; grid-template-columns: 4px 30px 1fr; align-items: center; gap: 11px; padding: 9px 13px; background: transparent; border: 0; border-bottom: 1px solid rgba(182,163,201,0.12); font: inherit; color: #f4e9ff; text-align: left; cursor: pointer;" style-hover="background: rgba(95,208,255,0.12);">
        <span style="width: 4px; height: 22px; background: #5fd0ff; box-shadow: 0 0 10px #5fd0ff; opacity: {{ a2 }};"></span>

        <span><span style="display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.06em;">ELECTRONICS</span><span style="display: block; font-size: 10px; color: #b6a3c9;">audio · holo · compute · repair</span></span>

      <button type="button" onClick="{{ p1 }}" style="display: grid; grid-template-columns: 4px 30px 1fr; align-items: center; gap: 11px; padding: 9px 13px; background: transparent; border: 0; border-bottom: 1px solid rgba(182,163,201,0.12); font: inherit; color: #f4e9ff; text-align: left; cursor: pointer;" style-hover="background: rgba(255,138,51,0.12);">
        <span style="width: 4px; height: 22px; background: #ff8a33; box-shadow: 0 0 10px #ff8a33; opacity: {{ a1 }};"></span>
        <span style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #ff8a33;">L2</span>
        <span><span style="display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.06em;">GLASTELLE</span><span style="display: block; font-size: 10px; color: #b6a3c9;">orbital psychology · ascend</span></span>
      </button>
      <button type="button" onClick="{{ p0 }}" style="display: grid; grid-template-columns: 4px 30px 1fr; align-items: center; gap: 11px; padding: 9px 13px; background: transparent; border: 0; font: inherit; color: #f4e9ff; text-align: left; cursor: pointer;" style-hover="background: rgba(255,95,200,0.12);">
        <span style="width: 4px; height: 22px; background: #ff5fc8; box-shadow: 0 0 10px #ff5fc8; opacity: {{ a0 }};"></span>

    </div>

  <div style="position: absolute; bottom: 26px; left: 30px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: baseline; gap: 12px;">
      <span style="font-family: 'Press Start 2P', monospace; font-size: 15px; color: #a9f7ff; text-shadow: 0 0 14px rgba(130,247,255,0.7);">{{ levelTag }}</span>
      <span style="font-size: 19px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;">{{ levelName }}</span>
    </div>
    <div style="font-size: 12px; letter-spacing: 0.2em; color: #b6a3c9; text-transform: uppercase;">{{ levelTag2 }}</div>
    <div style="display: flex; gap: 8px; margin-top: 4px;">
      <button type="button" onClick="{{ down }}" style="font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 10px 15px; color: #ffc9ec; background: rgba(212,64,143,0.14); border: 1px solid rgba(212,64,143,0.55); border-radius: 2px; cursor: pointer;" style-hover="background: rgba(212,64,143,0.3);">&#9660; DOWN</button>
      <button type="button" onClick="{{ up }}" style="font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 10px 15px; color: #ffc9ec; background: rgba(212,64,143,0.14); border: 1px solid rgba(212,64,143,0.55); border-radius: 2px; cursor: pointer;" style-hover="background: rgba(212,64,143,0.3);">&#9650; UP</button>
      <button type="button" onClick="{{ toggleTour }}" style="font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 10px 15px; color: #a9f7ff; background: rgba(64,212,200,0.12); border: 1px solid rgba(64,212,200,0.5); border-radius: 2px; cursor: pointer;" style-hover="background: rgba(64,212,200,0.28);">{{ tourLabel }}</button>

<script type="text/x-dc" data-dc-script data-props="{&quot;pixelation&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.5,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;bloom&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.95,&quot;min&quot;:0,&quot;max&quot;:2.2,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Look&quot;}}">
const NAMES = [
  ['L1', 'Home Decor', 'floating mint sofas · three moons · galaxy carpet'],
  ['L2', 'Glastelle', 'venus gas walls · atmosphere orbs · green terminals'],
  ['L3', 'Electronics Department', 'circuit walls · holo displays · anomalous signals'],
  ['L4', "Xavier's Gifts", 'rune-lit boxes · star maps · dimensional portals'],
  ['L5', "Men's Casualwear", '80s space fashion · mirrored fitting rooms'],
  ['L6', 'Ramda', 'floating numerals 1–9 · counting terminals'],
  ['L7', 'Sporting Goods', 'cosmic courts · jerseys · dance-floor arena'],
  ['L8', 'Feluzia', 'championship stage · trophies · confetti'],
];

class Component extends DCLogic {
  state = { floor: 0, tour: false };

  go = (n) => this.setState({ floor: Math.max(-1, Math.min(7, n)) });

  renderVals() {
    const f = this.state.floor;
    const plaza = f < 0;
    const vals = {
      floor: f,
      pixelation: this.props.pixelation ?? 0.5,
      bloom: this.props.bloom ?? 0.6,
      tour: this.state.tour,
      tourLabel: this.state.tour ? '\u25A0 STOP DRIFT' : '\u25B6 AUTO DRIFT',
      toggleTour: () => this.setState((s) => ({ tour: !s.tour })),
      up: () => this.go(f + 1),
      down: () => this.go(f - 1),
      levelTag: plaza ? 'P' : NAMES[f][0],
      levelName: plaza ? 'The Plaza' : NAMES[f][1],
      levelTag2: plaza ? 'grand entrance · searchlights · always open' : NAMES[f][2],
      pOut: () => this.go(-1),
      aOut: plaza ? 1 : 0,
    };
    for (let i = 0; i < 8; i++) {
      vals['p' + i] = () => this.go(i);
      vals['a' + i] = i === f ? 1 : 0;
    }
    return vals;
  }
}
</script>
</body>
</html>
